    \ meaningful:\n   the primary and the reference parse both see the failure. */\n#include <stdlib.h>\n\nstatic\
    \ long env_n(const char* name)\n{\n    const char* s = getenv(name);\n    return s ? strtol(s, NULL, 10) : 0;\n\
    }\n\nstatic long n_malloc, n_realloc;\n\nvoid* ini_malloc(size_t size)\n{\n    long from = env_n(\"INI_FAIL_MALLOC_FROM\"\
    );\n    n_malloc++;\n    if (from > 0 && n_malloc >= from)\n        return NULL;\n    return malloc(size);\n\
    }\n\nvoid ini_free(void* ptr)\n{\n    free(ptr);\n}\n\nvoid* ini_realloc(void* ptr, size_t size)\n{\n    long\
