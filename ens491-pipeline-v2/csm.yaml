#
# Regenerate the JSON view after editing:   python3 csm_tool.py yaml2json csm.yaml
# Check consistency:                        python3 csm_tool.py check csm.yaml
#
# Conventions
#   booleans are 0/1 (C preprocessor semantics); the ACTS bridge renders them as false/true
#   integer options: 'partitions' are inclusive intervals covering domain.range; the representative
#                    is the value used for test generation; any legal value maps to exactly one class
#   enum/string options: 'token' is the ACTS-safe spelling of a value
#   expressions (active_when, constraints, test-suite conditions) use the CSM expression language:
#     if A == 1 and B != "x" then C <= D      |  A in [1, 2]  |  not (A == 0 or B == 1)
#   constraint kind: hard = configuration invalid; soft = legal but contradictory (tested, warned)
#   status: hypothesis | confirmed | refuted   (tools ignore refuted; hypotheses only on request)

