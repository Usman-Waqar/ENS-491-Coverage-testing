test_suite:
  oracle: 'Golden-output diff: each developer variant is a driver compiled with specific -D flags whose stdout must
    equal a checked-in baseline file (tests/runtest.sh, tests/unittest.sh).'
  working_directory: '{subject}/tests'
  input_files: [no_file.ini, normal.ini, bad_section.ini, bad_comment.ini, user_error.ini, multi_line.ini, bad_multi.ini,
    bom.ini, duplicate_sections.ini, no_value.ini, long_section.ini, long_line.ini, name_only_after_error.ini]
  case_delimiter_regex: '^(?!\.\.\. )(.+?): e=-?[0-9]+.*$'
  drivers:
  - id: unittest
    source: '{subject}/tests/unittest.c'
    origin: developer
    fixed_runtime: {api_entry_point: ini_parse, handler_return_policy: reject_flagged}
    extra_link_sources_when:
    - when: (INI_CUSTOM_ALLOCATOR == 1 and INI_USE_STACK == 0)
      sources: ['{workspace}/drivers/alloc_shim.c']
    notes: Parses the 13 input files with ini_parse(). Supports both handler signatures.
  - id: unittest_string
    source: '{subject}/tests/unittest_string.c'
    origin: developer
    fixed_runtime: {api_entry_point: ini_parse_string, handler_return_policy: accept_all}
    compatible_when: INI_HANDLER_LINENO == 0
    extra_link_sources_when:
    - when: (INI_CUSTOM_ALLOCATOR == 1 and INI_USE_STACK == 0)
      sources: ['{workspace}/drivers/alloc_shim.c']
    notes: Handler has the 4-argument signature only; with INI_HANDLER_LINENO=1 it is an incompatible-pointer-type
      warning under GCC 13 and an error from GCC 14, and calling it is undefined behaviour.
