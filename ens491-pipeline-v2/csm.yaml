- name: api_entry_point
  binding: runtime
  description: Which public parse function the client calls. All five funnel into ini_parse_stream() but differ
    in the reader (fgets vs in-memory string reader) and in error reporting (-1 file open, -3 ferror).
  domain:
    type: enum
    values:
    - {value: ini_parse, label: default, rationale: Filename API; used by tests/unittest.c and the README examples.}
    - {value: ini_parse_file, rationale: FILE* API; adds the ferror() -> -3 path.}
    - {value: ini_parse_stream, rationale: Custom ini_reader callback (an fgets wrapper in the driver).}
    - {value: ini_parse_string, rationale: NUL-terminated buffer through ini_reader_string().}
    - {value: ini_parse_string_length, rationale: Explicit-length buffer through ini_reader_string().}
  default: ini_parse
  default_source: docs
  apply: {mechanism: driver_cli, flag: --api}
  evidence:
  - {file: ini.h, lines: '82,86,91,97,102', kind: definition}
  - {file: ini.c, lines: '95,273,280,295,321,326', kind: use}
  - {file: README.md, kind: documentation}
  provenance:
    discovered_by: *id001
    model: claude-opus-5-5 (agent session, 2026-11-10)
    stages: *id002
    status: confirmed
    confirmed_by: [source_inspection, driver_execution]

- name: handler_return_policy
  binding: runtime
  description: What the client's ini_handler returns. A zero return marks the line as an error (and stops parsing
    when INI_STOP_ON_FIRST_ERROR=1). The library has no default; the model default is the convention of the developer
    driver tests/unittest.c.
  domain:
    type: enum
    values:
    - {value: reject_flagged, label: default, rationale: 'Developer convention: fail only on user=parse_error (tests/user_error.ini).'}
