- name: INI_INITIAL_ALLOC
  binding: compile_time
  description: Initial heap line-buffer size. Without realloc it is the effective maximum line size (INI_MAX_LINE
    is then ignored).
  domain:
    type: integer
    range: {min: 2, max: 2147483647, evidence: 'INI_INITIAL_ALLOC=1 reads line[-1] in the overflow check (ASan heap-buffer-overflow),
        with and without INI_ALLOW_REALLOC.'}
    partitions:
    - label: degenerate
      interval: [2, 2]
      representative: 2
      rationale: With realloc the buffer doubles many times; without realloc every line overflows.
    - label: tiny
      interval: [3, 15]
      representative: 5
      rationale: 'Far below typical line lengths: realloc always triggers. Developer values 5 and 12 fall here.'
    - label: small
      interval: [16, 199]
      representative: 20
      rationale: Around the developer INI_MAX_LINE=20 setting (heap_max_line, heap_string variants).
    - label: default_or_larger
      interval: [200, max]
      representative: 200
      rationale: 'At or above the default INI_MAX_LINE: no realloc is ever needed for default limits.'
    rationale: 'Partitions relative to line length and to INI_MAX_LINE: degenerate (2), far below typical lines
      so realloc always triggers (5), around INI_MAX_LINE=20 (20), default (200). The developer suite also uses
      12 (alloc variant); it is legal (inside valid_range) but treated as off-partition.'
  default: 200
  default_source: code
  active_when: INI_USE_STACK == 0
  apply: {mechanism: c_macro, macro: INI_INITIAL_ALLOC, format: int}
