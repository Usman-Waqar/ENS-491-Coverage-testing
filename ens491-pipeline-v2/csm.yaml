constraints:
- id: C1
  kind: hard
  expr: if INI_CUSTOM_ALLOCATOR == 1 then INI_USE_STACK == 0
  origin: documented
  status: confirmed
  rationale: 'Documented contract: a custom allocator requires the heap line buffer. In code the macro is merely
    ignored on the stack path (gcc -E output identical), but the documentation states it as a requirement, so the
    model treats the combination as invalid.'
  evidence:
  - {file: ini.h, lines: 190-191, kind: documentation, note: '"(INI_USE_STACK must also be 0)"'}
  - {file: README.md, lines: '39', kind: documentation}
  provenance:
