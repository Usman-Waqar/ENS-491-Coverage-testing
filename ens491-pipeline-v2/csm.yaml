    model: claude-opus-5-5 (agent session, 2026-11-10)
    confirmed_by: [documentation]
    status: confirmed
- id: C2
  kind: soft
  expr: if INI_USE_STACK == 0 and INI_ALLOW_REALLOC == 1 then INI_INITIAL_ALLOC <= INI_MAX_LINE
  origin: documented
  status: confirmed
  rationale: The buffer is documented to grow *to* INI_MAX_LINE. If the initial size already exceeds it, the growth
    loop never runs and lines longer than INI_MAX_LINE are accepted, so INI_MAX_LINE no longer bounds line length.
    Builds and runs without error.
  evidence:
  - {file: README.md, lines: '38', kind: documentation}
  - {file: ini.c, lines: '104,146', kind: use}
  provenance:
    discovered_by: [llm, human]
    model: claude-opus-5-5 (agent session, 2026-11-10)
    confirmed_by: [documentation]
    status: confirmed
- id: C3
  kind: soft
  expr: if INI_USE_STACK == 0 and INI_ALLOW_REALLOC == 0 then INI_INITIAL_ALLOC == INI_MAX_LINE
  origin: code
  status: confirmed
  rationale: 'On the heap without realloc the line limit is INI_INITIAL_ALLOC and INI_MAX_LINE is ignored entirely
    (verified: gcc -E output identical for different INI_MAX_LINE). Setting them differently means the configured
    maximum line length is not the enforced one. The developer variant heap_max_line sets both to 20 for exactly
    this reason. Documentation is itself inconsistent here: the ini.h comment for INI_ALLOW_REALLOC says the non-realloc
    buffer is INI_MAX_LINE bytes, while README.md and the code use INI_INITIAL_ALLOC.'
  evidence:
  - {file: ini.c, lines: 103-104, kind: use}
  - {file: ini.h, lines: 158-160, kind: documentation, note: Claims a fixed-size buffer of INI_MAX_LINE bytes when
      realloc is off.}
  - {file: README.md, lines: '38', kind: documentation, note: Says the fixed buffer is INI_INITIAL_ALLOC bytes.}
  - {file: tests/meson.build, lines: '15', kind: test}
  provenance:
    discovered_by: [llm, human]
    model: claude-opus-5-5 (agent session, 2026-11-10)
    confirmed_by: [preprocess_equivalence]
    status: confirmed
- id: C4
  kind: soft
  expr: if INI_ALLOW_MULTILINE == 1 then INI_MAX_NAME >= 2
  origin: llm
  status: confirmed
  rationale: With INI_MAX_NAME=1 the stored previous name is always empty, so the '*prev_name' test never holds
    and multi-line continuation is silently disabled although INI_ALLOW_MULTILINE=1 (indented lines become
    parse errors).
  evidence:
  - {file: ini.c, lines: '110-111,189-190', kind: use}
  - {file: ini.h, lines: 152-156, kind: documentation}
  - {file: ini.c, kind: empirical, note: 'Phase 4 iteration 01 test t_maxname1_multiline: INI_MAX_NAME=1 -> continuation
      line reported as error e=3'}
  provenance: {discovered_by: [llm, empirical], model: claude-opus-5-5 (Phase 4 iteration 01), stages: [phase4_iter01],
    confirmed_by: [driver_execution], status: confirmed}
- id: C5
  kind: soft
  expr: if INI_USE_STACK == 0 and INI_ALLOW_REALLOC == 1 then INI_INITIAL_ALLOC < INI_MAX_LINE
  origin: llm
  status: hypothesis
  rationale: The growth loop runs only while max_line < INI_MAX_LINE, so with INI_INITIAL_ALLOC == INI_MAX_LINE
    realloc is enabled but can never grow the buffer (stricter than C2). Code reading only; no test yet.
  evidence:
