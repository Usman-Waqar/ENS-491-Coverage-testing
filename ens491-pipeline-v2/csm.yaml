  - {file: meson.build, kind: build_system}
- option_name: 'meson: distro_install / with_INIReader / tests / default_library'
  reason: 'Packaging and build-orchestration options, not variability of the parser. Notable interaction for the
    study: with distro_install=true (the meson default) meson.build ignores every feature option above, so meson
    users get defaults regardless of what they set.'
