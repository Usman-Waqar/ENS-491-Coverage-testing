- name: INI_MAX_LINE
  binding: compile_time
  description: 'Maximum line buffer size in bytes (must be 3 more than the longest line: ''\r'', ''\n'', NUL). Overlong
    lines are discarded through a 16-byte ''abyss'' buffer and reported as an error.'
  domain:
    type: integer
    range: {min: 2, max: 2147483647, evidence: 'INI_MAX_LINE=1 makes the ''line too long'' test read line[-1] (UBSan:
        index out of bounds, ini.c:166). Upper bound is INT_MAX because the size is passed to the reader as (int)max_line.'}
    partitions:
    - label: degenerate
      interval: [2, 2]
      representative: 2
      rationale: 'Smallest legal buffer: every non-empty line overflows and is discarded.'
    - label: small
      interval: [3, 199]
      representative: 20
      rationale: Below the default; some developer-test lines exceed it (overflow/discard path). 20 is the developer
        value.
    - label: default
      interval: [200, 200]
      representative: 200
      rationale: Project default.
    - label: large
      interval: [201, max]
      representative: 4096
      rationale: Above every test-input line; the overflow path is unreachable.
    rationale: 'Equivalence partitions relative to input line length L: buffer degenerate (2), buffer < L+3 for
      some inputs (20), typical default (200), buffer >> L for all inputs (4096). 2 is the lower boundary; 1 is
      an invalid boundary value (UB) and is excluded.'
  default: 200
  default_source: code
  active_when: INI_USE_STACK == 1 or INI_ALLOW_REALLOC == 1
  apply: {mechanism: c_macro, macro: INI_MAX_LINE, format: int}
  evidence:
  - {file: ini.h, lines: 138-142, kind: definition}
  - {file: ini.c, lines: '100-101,146,149-150,165-166', kind: use}
  - {file: README.md, lines: '35', kind: documentation}
  - {file: meson_options.txt, lines: '61', kind: build_system}
  build_system_alias: max_line_length
  provenance:
    discovered_by: *id001
    model: claude-opus-5-5 (agent session, 2026-11-10)
    stages: *id002
    status: confirmed
    confirmed_by: [documentation, source_inspection, preprocess_equivalence, sanitizer_probe]

- name: INI_MAX_SECTION
  binding: compile_time
  description: Size in bytes (including NUL) of the section-name buffer. Longer names are silently truncated.
  domain:
    type: integer
    range: {min: 1, max: 2147483647, evidence: 'INI_MAX_SECTION=0 declares char section[0]; ini_strncpy0 computes
        size-1 = SIZE_MAX and overflows the stack buffer (ASan stack-buffer-overflow).'}
    partitions:
    - label: degenerate
      interval: [1, 1]
      representative: 1
      rationale: Every section name is truncated to the empty string.
    - label: small
      interval: [2, 49]
      representative: 8
      rationale: Shorter than most section names in the test inputs; truncation on common inputs.
    - label: default
      interval: [50, 50]
      representative: 50
      rationale: Project default; tests/long_section.ini (62 chars) is truncated.
    - label: large
      interval: [51, max]
      representative: 256
      rationale: No test input is truncated.
    rationale: 'Partitions relative to section-name length N: always-truncate (1), truncate typical names (8), truncate
      only long names (50, default), never truncate (256). Note the developer driver itself truncates section names
      to 49 chars (char Prev_section[50]), which masks differences above 50 in its golden output.'
  default: 50
  default_source: code
  apply: {mechanism: c_macro, macro: INI_MAX_SECTION, format: int}
  evidence:
  - {file: ini.h, lines: 144-150, kind: definition}
  - {file: ini.c, lines: '109,207', kind: use}
  - {file: README.md, lines: '36', kind: documentation}
  - {file: meson_options.txt, lines: '66', kind: build_system}
  build_system_alias: max_section_length
  provenance:
    discovered_by: *id001
    model: claude-opus-5-5 (agent session, 2026-11-10)
    stages: *id002
    status: confirmed
    confirmed_by: [documentation, source_inspection, sanitizer_probe]

- name: INI_MAX_NAME
  binding: compile_time
  description: Size in bytes (including NUL) of the stored previous-name buffer. It is only used to remember the
    name for multi-line continuations; names passed to the handler for name=value lines are never truncated.
  domain:
    type: integer
    range: {min: 1, max: 2147483647, evidence: INI_MAX_NAME=0 triggers an out-of-bounds access in ini_strncpy0 (UBSan).}
    partitions:
    - label: degenerate
      interval: [1, 1]
      representative: 1
      rationale: prev_name is always empty, which silently disables multi-line continuation.
    - label: small
      interval: [2, 49]
      representative: 8
      rationale: Continuation lines are reported under a truncated name.
    - label: default
      interval: [50, 50]
      representative: 50
      rationale: Project default.
    - label: large
      interval: [51, max]
      representative: 256
      rationale: No continuation name is truncated.
    rationale: 'Same partitioning as INI_MAX_SECTION, relative to property-name length. The minimum boundary is
      behaviourally significant: with INI_MAX_NAME=1 the ''*prev_name'' guard is always false.'
  default: 50
  default_source: code
  active_when: INI_ALLOW_MULTILINE == 1
  apply: {mechanism: c_macro, macro: INI_MAX_NAME, format: int}
  evidence:
  - {file: ini.h, lines: 152-156, kind: definition}
