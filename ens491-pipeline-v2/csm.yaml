- name: INI_START_COMMENT_PREFIXES
  binding: compile_time
  description: Set of characters that start a whole-line comment (tested with strchr on the first non-blank character).
  domain:
    type: string
    values:
    - {value: ;#, token: SEMI_HASH, label: default, rationale: Both configparser comment characters.}
    - {value: ;, token: SEMI, label: semicolon-only, rationale: Lines starting with '#' become name/value lines
        -- interacts with ALLOW_NO_VALUE and inline comments.}
    - {value: '#', token: HASH, label: hash-only, rationale: 'Lines starting with '';'' are no longer comments;
        '';'' is the default inline prefix, so this probes the start-vs-inline prefix interaction.'}
    - {value: '', token: NONE, label: none, rationale: 'Empty set: no start-of-line comments at all (strchr("",
        ''\0'') still matches blank lines, so blank lines are unaffected).'}
    rationale: 'Open string domain (any character set). Partitioned by which of the two conventional comment characters
      are recognised: both / only '';'' / only ''#'' / neither. Exotic prefixes (e.g. ''['' or ''='') are excluded
      because they redefine core syntax rather than comment handling.'
  default: ;#
  default_source: code
  apply: {mechanism: c_macro, macro: INI_START_COMMENT_PREFIXES, format: c_string_literal}
  evidence:
  - {file: ini.h, lines: 117-121, kind: definition}
  - {file: ini.c, lines: '186', kind: use}
  - {file: README.md, lines: '23', kind: documentation}
  - {file: meson_options.txt, lines: '31', kind: build_system}
  build_system_alias: start-of-line_comment_prefix
  provenance:
    discovered_by: *id001
    model: claude-opus-5-5 (agent session, 2026-11-10)
    stages: *id002
    status: confirmed
    confirmed_by: [documentation, source_inspection]

